name: Android APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Windows EXE"]
    types: [completed]

permissions:
  contents: write

jobs:
  apk:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev git
      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0" setuptools
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v2-
      - name: Surum (son Windows surumuyle ayni)
        id: ver
        run: |
          TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo $TAG > assets/version.txt
          N=${TAG#surum-}
          sed -i "s/^version = .*/version = 1.$N/" buildozer.spec
          # her derlemede artan surum kodu: telefon yeni APK'yi guncelleme olarak kabul eder
          sed -i "s/^version = .*/&\nandroid.numeric_version = $((1000 + ${{ github.run_number }}))/" buildozer.spec
          grep -n "version" buildozer.spec
      - name: Imza anahtari (her surumde ayni -> eskinin ustune guncellenir)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kafakafaya-imza-v1
      - name: Anahtar yoksa olustur
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "fingerprint" || true
      - name: APK olustur
        run: yes | buildozer android debug
      - name: APK adi
        run: cp bin/*.apk KafaKafaya.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KafaKafaya-apk
          path: KafaKafaya.apk
      - name: Release'e ekle
        run: gh release upload ${{ steps.ver.outputs.tag }} KafaKafaya.apk --clobber --repo ${{ github.repository }}

