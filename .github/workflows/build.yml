name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketleri kur
        run: python -m pip install -r requirements.txt
      - name: Surum numarasi
        run: echo surum-${{ github.run_number }} > assets/version.txt
      - name: Duman testi (gercek pygame)
        run: python ci_smoke.py
      - name: EXE olustur
        run: python -m PyInstaller --noconfirm --onefile --windowed --name KafaKafaya --icon assets/icon.ico --add-data "assets;assets" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: KafaKafaya-exe
          path: dist/KafaKafaya.exe
      - name: Release olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Kafa Kafaya (surum ${{ github.run_number }})
          files: dist/KafaKafaya.exe
          make_latest: true
