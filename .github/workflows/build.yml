name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketleri kur
        run: python -m pip install -r requirements.txt
      - name: "PyInstaller kaynaktan derlenir (kendi baslaticisi, antivirus yanlis alarmlarini azaltir)"
        run: |
          python -m pip uninstall -y pyinstaller
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          python -m pip install --no-binary pyinstaller --no-cache-dir pyinstaller
      - name: Surum numarasi
        run: echo surum-${{ github.run_number }} > assets/version.txt
      - name: Duman testi (gercek pygame)
        run: python ci_smoke.py
      - name: Surum bilgisi
        run: (Get-Content version_info.txt) -replace 'RUNNUM', '${{ github.run_number }}' | Set-Content version_info.txt
      - name: EXE olustur (tek dosya)
        run: python -m PyInstaller --noconfirm --onefile --windowed --noupx --name KafaKafaya --icon assets/icon.ico --version-file version_info.txt --add-data "assets;assets" main.py
      - name: Klasorlu surum (antivirusler daha az takilir)
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --noupx --name KafaKafaya_klasor --icon assets/icon.ico --version-file version_info.txt --add-data "assets;assets" --distpath dist_dir main.py
          Rename-Item dist_dir/KafaKafaya_klasor/KafaKafaya_klasor.exe KafaKafaya.exe
          Compress-Archive -Path dist_dir/KafaKafaya_klasor/* -DestinationPath dist/KafaKafaya_klasor.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KafaKafaya-exe
          path: |
            dist/KafaKafaya.exe
            dist/KafaKafaya_klasor.zip
      - name: Release olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Kafa Kafaya (surum ${{ github.run_number }})
          files: |
            dist/KafaKafaya.exe
            dist/KafaKafaya_klasor.zip
          make_latest: true
